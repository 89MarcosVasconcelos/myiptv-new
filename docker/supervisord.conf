; Usado só pelo serviço "app" (nginx + php-fpm juntos no mesmo container).
; O serviço "worker" (queue:work) não passa por aqui — roda direto como
; processo principal do container, e quem cuida de reiniciar se ele cair é a
; política "restart: unless-stopped" do docker-compose (equivalente ao que o
; NSSM fazia no Windows).

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-fpm]
command=php-fpm -F
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
