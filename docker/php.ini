; Ajustes de producao — sobrescreve o php.ini padrao da imagem.
memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300

; O CSV de import pode ter dezenas de milhares de linhas — o parsing em si
; (ImportCsvJob) roda no worker, sem limite de tempo de requisicao HTTP, mas
; o upload do arquivo em si passa pelo php-fpm do serviço "app".

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000

; error_reporting fica no padrao da imagem; APP_DEBUG=false no .env de
; producao ja evita vazar stack trace pro usuario final.
