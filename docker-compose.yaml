# MPIPTV — compose para Coolify (build pack "Docker Compose") e para uso local.
#
#   app    -> API FastAPI + front estático (porta 7678). É o serviço ao qual o
#             domínio deve apontar no Coolify (ex.: https://seu-dominio:7678).
#   worker -> APScheduler: checagem de links, limpeza, jobs periódicos.
#   mysql  -> MySQL 8 próprio do projeto (volume nomeado; banco novo e vazio).
#
# Variáveis SERVICE_PASSWORD_* são "magic variables" do Coolify: ele gera e
# guarda a senha sozinho. Fora do Coolify, defina-as no .env (ver .env.example).
# O nome dos serviços (app/worker) é a chave do mapeamento de domínio no
# Coolify — não renomeie.
#
# Uso local: `docker network create coolify` (uma vez) e `docker compose up -d --build`
# (o docker-compose.override.yaml publica a porta 7678 no host só localmente).

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${SERVICE_PASSWORD_MYSQLROOT:-troque_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iptv}
      MYSQL_USER: ${MYSQL_USER:-iptv_app}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL:-troque_app}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  app:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iptv}
      MYSQL_USER: ${MYSQL_USER:-iptv_app}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL:-troque_app}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${SERVICE_PASSWORD_ADMIN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      # true quando o site é servido por HTTPS (Coolify/Traefik) — cookie só trafega em TLS
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    expose:
      - "7678"
    volumes:
      - app_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:7678/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 40s
    networks:
      - default
      - coolify

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE:-iptv}
      MYSQL_USER: ${MYSQL_USER:-iptv_app}
      MYSQL_PASSWORD: ${SERVICE_PASSWORD_MYSQL:-troque_app}
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  mysql_data:
  app_data:

networks:
  coolify:
    external: true
