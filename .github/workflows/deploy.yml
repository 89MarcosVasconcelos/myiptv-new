name: Deploy

# A cada push em producao/main: verifica o código e, se os secrets existirem,
# avisa o Coolify (webhook) para puxar o commit novo. Quem builda a imagem e
# sobe os containers é o próprio Coolify.
on:
  push:
    branches: [producao, main]
  workflow_dispatch: {}

jobs:
  verify:
    name: Verificar código
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências Python
        run: |
          pip install -r api/requirements.txt
          pip install -r worker/requirements.txt

      - name: Compilar Python (sintaxe)
        run: python -m compileall -q api/app worker/app

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json

      - name: Build do front
        working-directory: frontend-react
        run: |
          npm ci
          npm run build

  deploy:
    name: Disparar deploy no Coolify
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      # Secrets (Settings > Secrets and variables > Actions):
      #   COOLIFY_WEBHOOK_URL -> Application > Webhooks
      #   COOLIFY_TOKEN       -> Keys & Tokens no perfil do Coolify
      - name: Chamar webhook do Coolify
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK_URL" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Secrets do Coolify ausentes — pulando o webhook (o deploy automático do GitHub App, se ativo, continua valendo)."
            exit 0
          fi
          curl --fail --silent --show-error --request GET \
            --header "Authorization: Bearer ${COOLIFY_TOKEN}" \
            "${COOLIFY_WEBHOOK_URL}"
